name: Site source checks
on:
  pull_request:
  push:
    branches: [feature/site-refinement-2026-10-15]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate public application syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/products-page.js
          node --check scripts/build-site-preview.mjs
      - name: Verify source and public packaging
        run: node --test tests/*.test.mjs
